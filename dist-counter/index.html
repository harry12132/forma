<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>Forma Counter</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="shell">
<section class="hero"><span class="badge">FORMA RUNTIME · FIRST INTERACTIVE APP</span>
<h2 class="section-title">A little state goes a long way.</h2>
<p class="copy">This counter is built with Forma state and click events. No framework or dependencies required.</p>
<section class="panel glass" data-reveal="fade-up"><h2 class="section-title">Counter</h2>
<p class="copy">Current count: <span data-forma-bind="count">0</span></p>
<button type="button" class="button" data-forma-action="add:count:1">Add one</button>
<button type="button" class="button button-secondary" data-forma-action="subtract:count:1">Subtract one</button></section></section>
</main>
<script>document.documentElement.classList.add('js');const items=document.querySelectorAll('[data-reveal]');items.forEach(el=>el.classList.add('reveal'));if('IntersectionObserver'in window&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-visible');io.unobserve(e.target)}}),{threshold:.12});items.forEach(el=>io.observe(el))}else{items.forEach(el=>el.classList.add('is-visible'))}const state={"count":0};function renderState(){document.querySelectorAll('[data-forma-bind]').forEach(el=>{const key=el.getAttribute('data-forma-bind');el.textContent=String(state[key])})}document.addEventListener('click',event=>{const button=event.target.closest('[data-forma-action]');if(!button)return;for(const action of button.dataset.formaAction.split('|')){const [kind,key,raw]=action.split(':');if(!(key in state))continue;if(kind==='add')state[key]=Number(state[key])+Number(raw);else if(kind==='subtract')state[key]=Number(state[key])-Number(raw);else if(kind==='assign'){try{state[key]=JSON.parse(decodeURIComponent(raw))}catch{}}}renderState()});renderState()</script>
</body>
</html>
